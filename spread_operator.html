<body>
    <script>
        var arr1 = [100, 200, 300];

        console.log(...arr1); //spread operator

    <script>
        var arrr1 = [10,20,30];
        var arrr2 = [40,50,60,70,80];

        //var arrr3 = [...arrr1, ...arrr2]; //spread operator
        arrr1.push(35);
        var arrr3 = [5, ...arrr1, ...arrr2, 90];

        document.write(arrr3 + "<br>");
    </script>

    <script>
        var obj1 = {
            name: "karan",
            education: "IT",
        };
        var obj2 = {
            age: 22,
            phone:9322364562,
        };
        var obj3 = {...obj1,...obj2};
        console.log(obj3);
        document.write(obj3);
        document.write(JSON.stringify(obj3));
        document.write(`<pre>${JSON.stringify(obj3, null, 4)}</pre>`);

        
    </script>
