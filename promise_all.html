    <script>
        //promise 1
        let p1 = new Promise((resolve) => {
            setTimeout(() => resolve("Apple ready"),5000);
        });
        //promise 2
        let p2 = new Promise((resolve,reject) => {
            setTimeout(() => reject("Banana ready"),5000);
        });

        let p3 = new Promise((resolve) => {
            setTimeout(() => resolve("Grapes ready"),5000);
        });


        Promise.all([p1, p2, p3])
        .then((result) => {
            document.write("<h3>All fruits are ready</h3>");
            result.forEach((item) => document.write(item + "<br>"));
        })
        .catch((error) => {
            document.write(
                "<h3 style='color:red'>One or more promise failed</h3>",
            );
        });
    </script>
</body>
