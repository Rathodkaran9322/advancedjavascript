<h2>JavaScript Map Method</h2>

<script>
    //1.map
    //defination
    let numbers = [10, 20, 30, 40];

    let result = numbers.map(function (num) {
        return num * 2;
    });

    document.write(result + "<br>");
</script>

</script>
