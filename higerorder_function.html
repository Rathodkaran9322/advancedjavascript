<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Higher-Order Functions Example</title>
</head>
<body>

    <script>
        // 1. Multiply numbers by 2
        let numbers = [10, 20, 30, 40];
        let result = numbers.map(function (num) {
            return num * 2;
        });
        console.log(result);

        // 2. Convert names to uppercase
        let names = ["rahul", "divya", "karan", "pratik", "sonal"];
        let result1 = names.map((name) => name.toUpperCase());
        console.log(result1); 

        // 3. Calculate prices with GST (1.18%)
        let prices = [100, 200, 300];
        let finalPrice = prices.map((price) => price * 1.18);
        console.log(finalPrice);

        // 4. Extract student name
        let studnets = [
            { name: "Rahul", marks: 90 },
            { name: "Sumit", marks: 80 },
            { name: "Pranali", marks: 50 },
            { name: "Dinesh", marks: 10 },
            { name: "Santosh", marks: 95 }
        ];
        let server = studnets.map((studnet) => studnet.name);
        console.log(server);
    </script>


    <script>
        // 2. Filter()
        let numbers2 = [10, 15, 20, 22, 45, 46, 76, 88, 99];
        let result3 = numbers2.filter((num) => num % 2 === 0);
        console.log(result3);

        let marks = [35, 80, 25, 78, 41, 76, 21, 65];
        let passed = marks.filter((mark) => mark >= 60);
        console.log(passed);

        let price2 = [500, 300, 1000, 800, 150, 1200, 1400, 900];
        let result4 = price2.filter((price) => price >= 1000);
        console.log(result4);

        let employees = [
            { name: "Sachin", active: true },
            { name: "Amit", active: true },
            { name: "Rahul", active: false },
            { name: "Pooja", active: true },
            { name: "Kiran", active: false }
        ];
        let result5 = employees.filter((emp) => emp.active);
        console.log(result5);
    </script>


    <script>
        // 3. forEach() 
        //  perform an action for every element

        let name2 = ["Rahul", "Ganesh", "Samarth", "Khagesh"];
        name2.forEach(function (name) {
            console.log(name);
        });

        let numbers6 = [2, 3, 4, 5];
        numbers6.forEach((num) => {
            console.log("Number is ", num);
            console.log("Square is ", num * num);
        });
    </script>


    <script>
        // 4. reduce() 
        //  Converts an Array into a single result

        //Definantion : The reduce() method is processes arry element and accumlates them into a single result,such as number, string, object or another arry

        //syntax
        //array,reduce((accumaalor,cuurentvalue)=>){
        // return updated accumaalor
        // },initialvalue);
        //accumaltor : stores the accumalated result
        //currentvalue : the curretn arry element
        //initail value : the starting value of accumaltor
        
        let numbers7 = [10, 20, 30, 50, 80];
        let total = numbers7.reduce((sum, num) => {
            return sum + num;
        }, 0);
        console.log(total);

        let numbers8 = [25, 67, 78, 23, 67];
        let maximum = numbers8.reduce((max, num) => {
            return num > max ? num : max;
        }, numbers8[0]);
        console.log(maximum);
    </script>

    <script>
        // 5. find() 
        // returns the first element that satisfies the given condition
        let numbers9 = [10, 20, 30, 40, 50];
        let result9 = numbers9.find(function (num) {
            return num > 30;
        });
        console.log(result9);
    </script>

</body>
</html>
