<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //Global Scope//
        var a = "Hi Its Khagesh";
        var a = "Hi Its Karan";   //redclare allowed//
        a = "Hi its ayush";     //re-assign allowed//
        console.log(a);

        //function scope or block scope//
        let b = "Hello tejas";
        //let b = "Welcome khagesh";redeclare not allowed//
        b = "Welcome ishant"; //re-assign allowed//
        console.log(b);

        //block scope//
        const c = "Hello khagesh";
        //const c = "Hello ayush";redeclare not allowed//
        //c = "Hello tejas";re-assign not allowed//
        console.log(c);

        //using if condition//
        if(10==10){
            var a = "Hello khagesh"; //global scope//
            let b = "Hello ayush"; //block scope//
            const c = "Hello tejas"; //block scope//
            console.log(b);
            console.log(c);
        }
        console.log(a);
        //console.log(b); // ReferenceError: b is not defined
        //console.log(c); // ReferenceError: c is not defined
    </script> 
    
    <script>
        function example(){
            var p = 1; //global scope //
            let q = 2; //block scope //
            const r = 3; //block scope //

            if(true){ //inside this block
                var p  = 10;
                let q = 20;
                const r = 30;

                //Inside this block
                document.write("---------Inside the block---------" + "<br>");
                document.write("p = " + p + "<br>"); //10
                document.write("q = " + q + "<br>"); //20
                document.write("r = " + r + "<br> <br>"); //30
        }

          //outside this block
                document.write("---------Outside the block---------" + "<br>");
                document.write("p = " + p + "<br>"); //10 {it was Owerwritten by inner var x}
                document.write("q = " + q + "<br>"); //2
                document.write("r = " + r + "<br> <br>"); //3
        }
        //call the function
        example();
        
    </script>
</body>
</html>
