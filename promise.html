<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Promises</title>
</head>
<body>
    <!--
    promise means :i am doing some work now. I will give you the result later. If the work is done successfully then I wiill give you the result otherwise I will give you the error.

    for example:
    - call an API
    - fetching data from server
    - reading a file
    - database operation
    - waiting for timer

    Total 3 states of promises
    1. Pending : Initial state,before the promise succeeds or fails.
    2. Fulfilled : The operation complated successfully.
    3. Rejected : The operation failed.

    create a promise
    Syntax
    let promise = new Promise(function(resolve,reject){

    });
    -->

    <script>
        // Example 1
        let promise = new Promise(function (resolve, reject) {
            let success = true;

            if (success) {
                resolve("Operation Succesffully");
            } else {
                reject("Operation failed");
            }
        });
    </script>

    <script>
        // Example 2
        function login(username, password) {
            return new Promise(function (resolve, reject) {
                if (username === "admin" && password === "1234") {
                    resolve("Login Successfully");
                } else {
                    reject("Invalid password or username");
                }
            });
        }

        login("admin", "1234")
            .then(function (result) {
                console.log(result);
            })
            .catch(function (error) {
                console.log(error);
            });
    </script>

    <script>
        // Creating a Promise using prompt - user input
        let promise2 = new Promise(function (resolve2, reject2) {
            let username = prompt("Enter UerName");
            let password = prompt("Enter Password");

            if (username === "admin" && password === "1234") {
                resolve2("Login Successfully");
            } else {
                reject2("Invalid password or username");
            }
        });

        promise2
            .then(msg => {
                document.write("<h2 style='color:green'>" + msg + "</h2>");
            })
            .catch(err => {
                document.write("<h2 style='color:red'>" + err + "</h2>");
            })
            .finally(() => {
                document.write("<p style='color:blue'>Login attempt Completed</p>");
            });
    </script>

    <script>
        // Example 4: Asynchronous Promise
        let promise3 = new Promise((resolve, reject) => {
            console.log("Fetching data......");

            setTimeout(() => {
                let dataAvailbale = true;
                if (dataAvailbale) {
                    resolve("Data Received from server..Successfully");
                } else {
                    reject("Server Error .. Something went wrong.");
                }
            }, 5000);
        });

        promise3
            .then((res) => console.log(res))
            .catch((err) => console.log(err))
            .finally(() => console.log("Request process complete.."));
    </script>
</body>
</html>
