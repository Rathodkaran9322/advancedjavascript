<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Live Charachter counter</h2>
    <textarea
    id="message"
    oninput="countcharacters()"
    rows="5"
    cols="30"
    ></textarea>
    <h3 id="result">Characters: 0</h3>

    <script>
        function countcharacters() {
            //Get textarea element
            let text = document.getElementById("message");

            let count = text.value.length;

            //Display charcter count
            document.getElementById("result").innerText="characters :" + count;
        }
    </script>
</body>
</html>
