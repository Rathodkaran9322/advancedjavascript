<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Document</title> 
</head> 
<body> 
    <h2>Async Await Example</h2> 

    <p id="output"></p> 

    <script> 
        const output = document.getElementById("output"); 

        function log(msg){ 
            output.textContent += msg + "\n"; 
        } 

        // boil water 
        function boilWater(){ 
            return new Promise((resolve) => { 
                setTimeout(() => resolve("Water Boiled..."), 3000); 
            }); 
        } 

        function makeTea(){ 
            return new Promise((resolve) => { 
                setTimeout(() => resolve("Tea is ready..."), 3000); 
            }); 
        } 

        function toastBread(){ 
            return new Promise((resolve) => { 
                setTimeout(() => resolve("Bread Toasted..."), 3000); 
            }); 
        } 

        async function makeBreakfast() { 
            try { 
                log("Starting breakfast preparation"); 

                const step1 = await boilWater(); 
                log("1. " + step1); 

                const step2 = await makeTea(); 
                log("2. " + step2); 

                const step3 = await toastBread(); 
                log("3. " + step3); 

                log("All breakfast items are ready to eat"); 

            } catch (error) { 
                log("Error Occurred: " + error); 

            } finally { 
                log("Breakfast preparation completed"); 
            } 
        } 

        log("Kitchen Opened.."); 
        makeBreakfast(); 
    </script> 
</body> 
</html>
