<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch Fake API</title>
</head>
<body>
    <h2>Fetch Data Using ASYNC Await</h2>
    <button onclick="loadComments()">Click to load</button>
    <pre id="output"></pre>

    <script>
        async function loadComments() {
            try {
                document.getElementById("output").textContent = "Loading Post...";

                const response = await fetch("https://jsonplaceholder.typicode.com/comments");

                if (!response.ok) {
                    throw new Error("File not found...");
                }

                const data = await response.json();

                let result = "Data Loaded succesfully: \n\n";


                data.forEach((comments) => {
                    result += `ID: ${comments.id}\n Name: ${comments.name}\n Email : ${comments.email}`;
                });

                document.getElementById("output").textContent = result;

            } catch (error) {
                document.getElementById("output").textContent = 
                    "Error: " + error.message;
            }
        }
    </script>
</body>
</html>
