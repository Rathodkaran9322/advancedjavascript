<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Parent class (Person)
        class Person {
            constructor(name, age) {
                this.name = name;
                this.age = age;
            }

            showInfo() {
                document.write(`<br> Name : ${this.name}, Age : ${this.age}`);
            }
        }

        // Child class
        class Student extends Person {
            constructor(name, age, rollNo) {
                super(name, age);
                this.rollNo = rollNo;
            }

            showStudent() {
                document.write(
                    `<h1>Student Info :</h1> Name : ${this.name} <br> Age : ${this.age} <br> , Roll no : ${this.rollNo}`
                );
            }
        }

        // Grandchild class (Image madhun add kelela code)
        class GraduateStudnet extends Student {
            constructor(name, age, rollNo, degree) {
                super(name, age, rollNo);
                this.degree = degree;
            }

            showGraduate() {
                document.write(`<br> Degree - ${this.degree}`);
            }
        }

        // Object creation & method calls
        const g1 = new GraduateStudnet("Vaibhav", 21, 1003, "BCS");
        g1.showStudent(); //from student
        g1.showGraduate(); //from graduatestudnet
        g1.showInfo(); //from person
    </script>
</body>
</html>
