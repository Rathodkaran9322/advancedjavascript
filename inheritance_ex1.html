<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inheritance Example</title>
</head>
<body>
    <script>
        // Parent class (Person)
        class Person {
            constructor(name, age) {
                this.name = name;
                this.age = age;
            }
        }

        // Child class
        class Student extends Person {
            constructor(name, age, rollNo) {
                super(name, age);
                this.rollNo = rollNo;
            }

            showStudent() {
                document.write(
                    `<h1>Student Info :</h1> Name : ${this.name} <br> Age : ${this.age} <br> , Roll no : ${this.rollNo}`
                );
            }
        }

        // Creating instances/objects
        const s1 = new Student("Karan", 22, 1001);
        s1.showStudent();

        const s2 = new Student("Neha", 22, 1002);
        s2.showStudent();
    </script>
</body>
</html>
