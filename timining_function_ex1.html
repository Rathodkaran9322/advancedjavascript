<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
</head>
<body>

    <!-- 1. setTimeout Example with Button -->
    <!-- setTimeout() - Execute code after delay -->
    <!-- Syntax: setTimeout(function, delay); -->
    <button onclick="showMessage()">Click me</button>

    <script>
        function showMessage() {
            document.write("Please wait....");

            setTimeout(function () {
                document.write("<br>Hello Students");
            }, 5000);
        }
    </script>


    <!-- 2. setTimeout Example updating Element Text -->
    <p id="message">Waiting for message...</p>

    <script>
        setTimeout(function () {
            document.getElementById("message").textContent = "Welcome to js";
        }, 4000);
    </script>


    <!-- 3. setInterval Example (Console Log) -->
    <!-- setInterval() - Execute code repeatedly -->
    <!-- Syntax: setInterval(function, interval); -->
    <script>
        setInterval(function () {
            console.log("Hello Students welcome interval example");
        }, 3000);
    </script>


    <!-- 4. Counter Example using setInterval -->
    <h1>Counter Example</h1>
    <h2 style="color: red" id="count">0</h2>

    <script>
        let count = 0;
        setInterval(function () {
            count++;
            document.getElementById("count").textContent = count;
        }, 1000);
    </script>

</body>
</html>
