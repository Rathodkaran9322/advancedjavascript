<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timing Function Example 2</title>
</head>
<body>

    <!-- 1. clearTimeout() Example -->
    <h2>Cancel Timeout Example</h2>
    <button onclick="startTimer()">Start Timer</button>
    <button onclick="cancelTimer()">Cancel Timer</button>
    <p id="message2">Click Start Timer...</p>

    <script>
        let timerId;

        function startTimer() {
            timerId = setTimeout(function() {
                document.getElementById("message2").textContent = "Hello students...";
            }, 10000);
        }

        function cancelTimer() {
            clearTimeout(timerId);
            document.getElementById("message2").textContent = "Timer Canceled";
        }
    </script>


    <!-- 2. Counter with start and stop (Layout matched as requested) -->
    <h2>Counter with start and stop</h2>
    <h2 style="color: red" id="count">0</h2>
    <button onclick="startCounter()">Start</button>
    <button onclick="stopCounter()">Stop</button>

    <script>
        let count = 0;
        let intervalId = null;

        function startCounter() {
            if (intervalId !== null) {
                return;
            }
            intervalId = setInterval(function () {
                count++;
                document.getElementById("count").textContent = count;
            }, 1000);
        }

        function stopCounter() {
            clearInterval(intervalId);
            intervalId = null;
        }
    </script>


    <!-- 3. Live Digital Clock Example using setInterval -->
    <h1 id="clock"></h1>

    <script>
        function showtime() {
            let now = new Date();
            let time = now.toLocaleTimeString();
            document.getElementById("clock").textContent = time;
        }

        showtime();
        setInterval(showtime, 1000);
    </script>

</body>
</html>
